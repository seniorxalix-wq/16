// Carrusel de los tres circuitos: radio del círculo, tamaño de cada protoboard y velocidad de giro
const CIR_RING = { radio: 0.43, tam: 0.5, auto: 0.28 };

// Junta los tres circuitos en una sola pantalla: giran en círculo y al tocar uno se abren sus pasos
function armarCircuitos(volver, avanzar, subs) {
  const grupo = new THREE.Group();
  const n = subs.length;
  const items = subs.map((c, i) => {
    grupo.add(c.anclaje, c.gMat);              // se sacan de su pantalla individual (sus botones propios no se usan)
    c.grupo = grupo;
    c.ang0 = (i / n) * Math.PI * 2;
    c.v = 1;
    c.anclaje.userData.alTocar = () => abrirCir(i);
    return c;
  });

  const ESC = 0.95, hueco = 0.06, yBotones = -0.7;
  const gVolver = centrado(volver.clone(true));
  const gAvanzar = centrado(avanzar);
  const wV = new THREE.Box3().setFromObject(gVolver).getSize(new THREE.Vector3()).x;
  const wA = new THREE.Box3().setFromObject(gAvanzar).getSize(new THREE.Vector3()).x;
  gVolver.position.set(-(hueco / 2 + (wV * ESC) / 2), yBotones, 0);
  gAvanzar.position.set(hueco / 2 + (wA * ESC) / 2, yBotones, 0);
  marcarBoton(gVolver, 'arduino', ESC);
  marcarBoton(gAvanzar, 'evaluacion', ESC);
  const titulo = crearTitulo3D('Circuitos básicos');
  titulo.position.set(0, 0.74, 0);
  grupo.add(gVolver, gAvanzar, titulo);
  grupo.position.y = 0.165;

  const soporte = new THREE.Group();
  soporte.add(grupo);
  soporte.userData.escala = 1 / 1.3;
  soporte.scale.setScalar(soporte.userData.escala);

  const botonesBase = [gVolver, gAvanzar, ...items.map((it) => it.anclaje)];
  const cont = { grupo, items, botonesBase, animables: [gVolver, gAvanzar, titulo], sel: -1, pag: 0, ang: 0, visBtn: 1, tocado: 0, zoom: 1, t0: 0 };
  Object.defineProperty(cont, 'orient', { get() { return this.items[Math.max(this.sel, 0)].orient; } });
  return { soporte, botones: [...botonesBase], animables: cont.animables, flotantes: [], cont };
}

function mostrarPaginaCir(c) {
  const it = c.items[c.sel];
  llenarFichaDatos(it.paginas[c.pag], (c.pag + 1) + ' de ' + it.paginas.length);
  c.t0 = performance.now();
}

function abrirCir(i) {
  const c = circuitosEstado;
  if (!c) return;
  c.sel = i; c.pag = 0; c.zoom = 1;
  c.tocado = performance.now();
  mundo.circuitos.botones.length = 0;          // mientras hay un circuito abierto no se tocan los demás
  mostrarPaginaCir(c);
  fichaEl.hidden = false;
  document.body.classList.add('detalle');
}

function irCir(delta) {
  const c = circuitosEstado;
  if (!c || c.sel < 0) return;
  const n = c.items[c.sel].paginas.length;
  c.pag = (c.pag + delta + n) % n;
  c.tocado = 0;
  mostrarPaginaCir(c);
}

function cerrarCir(inmediato = false) {
  const c = circuitosEstado;
  fichaEl.hidden = true;
  document.body.classList.remove('detalle');
  if (!c || (c.sel < 0 && !inmediato)) return;
  c.sel = -1;
  const lista = mundo.circuitos.botones;
  lista.length = 0;
  lista.push(...c.botonesBase);
  if (inmediato) { c.items.forEach((it) => { it.k = 0; it.v = 1; }); c.visBtn = 1; }
}

function animarCir(ahora, dt) {
  const c = circuitosEstado;
  if (!c) return;
  const s1 = 1 - Math.exp(-dt * 8);
  if (c.sel < 0 && punteros.size === 0) c.ang += CIR_RING.auto * dt;     // el carrusel gira solo

  c.visBtn += ((c.sel < 0 ? 1 : 0) - c.visBtn) * s1;
  for (const b of c.animables) { b.userData.vis = c.visBtn; b.visible = c.visBtn > 0.01; }

  const foco = (c.sel >= 0 || c.items.some((it) => it.k > 0.002)) ? calcularFoco(c) : null;
  const escRing = CIR_RING.tam / PB.ancho;

  c.items.forEach((it, i) => {
    it.k += ((c.sel === i ? 1 : 0) - it.k) * s1;
    it.v += (((c.sel < 0 || c.sel === i) ? 1 : 0) - it.v) * s1;
    const e = it.k * it.k * (3 - 2 * it.k);

    // Lugar en el círculo (visto un poco desde arriba) o, si está abierto, en grande junto a la ficha
    const th = it.ang0 + c.ang, z0 = CIR_RING.radio * Math.cos(th);
    slot.set(CIR_RING.radio * Math.sin(th), -z0 * Math.sin(ANILLO.inclina), z0 * Math.cos(ANILLO.inclina));
    let esc = escRing, f = 1;
    if (foco && e > 0.0005) {
      slot.lerp(foco.pos, e);
      const fGrande = 1.4 * foco.tam / (it.tam * foco.mundoPorLocal);
      f = THREE.MathUtils.lerp(1, fGrande, e);
      esc = THREE.MathUtils.lerp(escRing, it.escalaNorm * fGrande, e);
    }
    it.anclaje.position.copy(slot);
    it.anclaje.scale.setScalar(esc * it.v);
    it.anclaje.visible = it.v > 0.01;

    // Página de materiales: en vez de la protoboard, las piezas giran en un anillo
    const enMat = c.sel === i && !!it.paginas[c.pag].mat;
    if (enMat) it.anclaje.visible = false;
    it.gMat.visible = enMat;
    if (enMat) {
      it.ang += 0.32 * dt;
      it.gMat.position.copy(slot);
      it.gMat.scale.setScalar(f * 0.95 / 0.82);
      it.itemsMat.forEach((m) => {
        const t2 = m.ang0 + it.ang, zz = CIR_R * Math.cos(t2);
        m.anc.position.set(CIR_R * Math.sin(t2), -zz * Math.sin(CIR_INC), zz * Math.cos(CIR_INC));
        m.giro += m.vel * dt;
        qa.setFromAxisAngle(EJE_Y, m.giro);
        qb.setFromAxisAngle(EJE_X, 0.6);
        m.orientM.quaternion.copy(qb.multiply(qa));
      });
    }

    if (c.sel !== i) {
      // En el carrusel: la protoboard gira sobre sí misma y su animación se ve completa
      it.giro += 0.4 * dt;
      qa.setFromAxisAngle(EJE_Y, it.giro);
      qb.setFromAxisAngle(EJE_X, 0.9);
      it.orient.quaternion.slerp(qb.multiply(qa), s1);
      it.tick(it.stFinal, ahora / 1000 + i * 1.3);
    } else {
      if (ahora - c.tocado > 2500) {
        qb.setFromAxisAngle(EJE_X, Math.PI / 2 - 0.35);
        qa.setFromAxisAngle(EJE_Y, 0.22 * Math.sin(ahora / 1400));
        it.orient.quaternion.slerp(qa.multiply(qb), s1);
      }
      it.tick(it.paginas[c.pag].st, (ahora - c.t0) / 1000);
    }
  });
}

function armarCircuito2(volver, avanzar, tablero, uno, resis, cNegro, amarillo, pulsador) {
  const grupo = new THREE.Group();
  const clonMat = { uno: uno.clone(true), res: resis.clone(true), tab: tablero.clone(true), pul: pulsador.clone(true) };
  const orient = new THREE.Group();
  const centro = new THREE.Group();
  centro.position.y = -PB.y / 2;
  centro.position.z = 0.0286;                 // el Uno queda detrás: se recentra todo el conjunto
  centro.add(tablero);
  orient.add(centro);

  const TAM = 0.95, escalaNorm = TAM / PB.ancho;
  const anclaje = new THREE.Group();
  anclaje.add(orient);
  anclaje.scale.setScalar(escalaNorm);
  anclaje.position.set(0, 0.08, 0);
  anclaje.userData.alTocar = () => abrirCir();
  anclaje.userData.sinLatido = true;
  grupo.add(anclaje);

  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const plata = mat(0xc8ccd4, 0.3, 0.9);
  const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
  const suave = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };
  const cil = (g, mt, r, p0, p1) => {
    const d = new THREE.Vector3().subVectors(p1, p0);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mt);
    c.position.copy(p0).addScaledVector(d, 0.5);
    c.quaternion.setFromUnitVectors(EJE_Y, d.normalize());
    g.add(c);
  };
  const chispa = (g, color, r) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color, toneMapped: false }));
    g.add(e);
    return e;
  };
  const zA = pbZ(PB.filas.A), zB = pbZ(PB.filas.B), zD = pbZ(PB.filas.D);

  // ---- Arduino Uno: largo hacia la derecha, tamaño real, junto al borde de arriba de la protoboard ----
  const gUno = new THREE.Group();
  uno.position.set(0, 0, 0);
  uno.rotation.y = 0;
  uno.updateMatrixWorld(true);
  let tam = new THREE.Box3().setFromObject(uno).getSize(new THREE.Vector3());
  uno.rotation.y = (tam.z > tam.x ? Math.PI / 2 : 0) + Math.PI + (UNO_INVERTIR ? Math.PI : 0);
  uno.updateMatrixWorld(true);
  tam = new THREE.Box3().setFromObject(uno).getSize(new THREE.Vector3());
  uno.scale.setScalar(0.0533 / tam.z);          // 53,3 mm de ancho real
  uno.updateMatrixWorld(true);
  const cajaU = new THREE.Box3().setFromObject(uno);
  const mm = 0.001;
  const zBorde = -PB.alto / 2 - 0.004;           // borde de los pines del Uno, a 4 mm de la protoboard
  const x0 = pbX(34) - UNO_PIN.d13 * mm;         // extremo del Uno contrario al USB
  uno.position.set(x0 - cajaU.min.x, -cajaU.min.y, zBorde - cajaU.max.z);
  gUno.add(uno);
  const pinUno = (dmm) => V3(x0 + dmm * mm, UNO_PIN.alto * mm, zBorde - UNO_PIN.borde * mm);
  const pD13 = pinUno(UNO_PIN.d13), pGND = pinUno(UNO_PIN.gnd), pD2 = pinUno(UNO_PIN.d2);

  // Cable "al aire" (con arco): del pin del Uno a un hueco de la protoboard
  const alambre = (color, a, b, alto) => {
    const g = new THREE.Group(), m = mat(color, 0.45);
    const p0 = V3(a.x, a.y + 0.004, a.z), p2 = V3(b.x, b.y + 0.004, b.z);
    const p1 = p0.clone().lerp(p2, 0.5);
    p1.y = Math.max(p0.y, p2.y) + alto * 2;
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p0, p1, p2), 28, 0.0006, 8, false), m));
    for (const p of [a, b]) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.0026, 0.0044, 0.0026), m);
      t.position.set(p.x, p.y + 0.0007, p.z);
      g.add(t);
    }
    return g;
  };
  const gAma = alambre(0xffd60a, pD13, pbHoyo(C2_AMA, 'A'), 0.006);
  const gNar = alambre(0xff8a1f, pD2, pbHoyo(C2_BA, 'A'), 0.006);
  const gGnd = alambre(0x15151a, pGND, pbRiel(.131, C2_RIEL_GND), 0.005);

  // ---- Resistencia de 220 Ω: de la columna 30 a la 40 (fila B) ----
  const gRes = new THREE.Group();
  const yR = PB.y + 0.0045, x1 = pbX(C2_AMA), x2 = pbX(C2_RES);
  resis.position.set((x1 + x2) / 2, yR - 0.00154, zB);
  gRes.add(resis);
  cil(gRes, plata, 0.00022, V3(x1, PB.y - 0.002, zB), V3(x1, yR, zB));
  cil(gRes, plata, 0.00022, V3(x2, PB.y - 0.002, zB), V3(x2, yR, zB));

  // ---- LED: pata larga en la 40, corta en la 41 (fila D) ----
  const gLed = new THREE.Group();
  const ledMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.25, emissive: 0xff2a1f, emissiveIntensity: 0.05 });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 16, 12), new THREE.MeshBasicMaterial({
    color: 0xff4a3a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
  }));
  { const xa = pbX(C2_RES), xc = pbX(C2_LED), xm = (xa + xc) / 2, yb = PB.y + 0.0085;
    cil(gLed, plata, 0.00018, V3(xa, PB.y - 0.002, zD), V3(xa, yb + 0.0015, zD));
    cil(gLed, plata, 0.00018, V3(xc, PB.y - 0.002, zD), V3(xc, yb, zD));
    const cu = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 0.0055, 20), ledMat);
    cu.position.set(xm, yb + 0.00275, zD);
    const dom = new THREE.Mesh(new THREE.SphereGeometry(0.0025, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), ledMat);
    dom.position.set(xm, yb + 0.0055, zD);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.00295, 0.00295, 0.0006, 20), ledMat);
    base.position.set(xm, yb + 0.0003, zD);
    halo.position.set(xm, yb + 0.0045, zD);
    gLed.add(cu, dom, base, halo);
  }

  // ---- Pulsador: a caballo sobre el canal, columnas 20 y 23 ----
  const gBtn = new THREE.Group();
  const bx = (pbX(C2_BA) + pbX(C2_BB)) / 2;
  pulsador.position.set(0, 0, 0);
  pulsador.rotation.y = 0;
  pulsador.updateMatrixWorld(true);
  const tB = new THREE.Box3().setFromObject(pulsador).getSize(new THREE.Vector3());
  pulsador.scale.setScalar(0.0072 / Math.max(tB.x, tB.z));
  pulsador.updateMatrixWorld(true);
  const cajaB = new THREE.Box3().setFromObject(pulsador), cenB = cajaB.getCenter(new THREE.Vector3());
  pulsador.position.set(bx - cenB.x, PB.y - 0.0005 - cajaB.min.y, -cenB.z);
  gBtn.add(pulsador);
  const yTopeBtn = PB.y - 0.0005 + (cajaB.max.y - cajaB.min.y);

  // Dedito que aprieta el botón
  const dedo = new THREE.Group();
  const yema = new THREE.Mesh(new THREE.CapsuleGeometry(0.0034, 0.012, 4, 14), mat(0xf2c7a5, 0.6));
  yema.position.y = 0.0034 + 0.006;
  dedo.add(yema);
  dedo.position.set(bx, yTopeBtn, 0);
  dedo.visible = false;

  // ---- Cables negros (al riel azul) ----
  const cable = (a, b) => {
    const g = new THREE.Group(), m = cNegro.clone(true);
    g.add(m);
    g.position.set((a.x + b.x) / 2, PB.y - 0.002, (a.z + b.z) / 2);
    g.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
    m.scale.x = Math.hypot(b.x - a.x, b.z - a.z) / 0.01016;
    g.userData.y0 = g.position.y;
    return g;
  };
  const cBtn = cable(pbHoyo(C2_BB, 'A'), pbRiel(.131, C2_RIEL_BTN));
  const cLed = cable(pbHoyo(C2_LED, 'A'), pbRiel(.131, C2_RIEL_LED));

  // ---- Etiquetas: D13, D2 y GND sobre el Uno ----
  const etiquetas = new THREE.Group();
  const etiqueta = (txt, color, p) => {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.font = '800 84px Manrope, sans-serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillStyle = color; c2.fillText(txt, 128, 64);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, toneMapped: false }));
    sp.scale.set(0.022, 0.011, 1);
    sp.position.set(p.x, p.y + 0.011, p.z - 0.006);
    etiquetas.add(sp);
  };
  etiqueta('D13', '#ffd60a', pD13);
  etiqueta('D2', '#ffa24d', pD2);
  etiqueta('GND', '#e9f3f1', pGND);

  // ---- Recorrido de la corriente: D13 → cable amarillo → resistencia → LED → cable negro → riel (−) ----
  const pt = (c, f, y) => { const v = pbHoyo(c, f); v.y = y; return v; };
  const alto = PB.y + 0.0012;
  const arco = pD13.clone().lerp(pbHoyo(C2_AMA, 'A'), 0.5); arco.y = PB.y + 0.0105;
  const ruta = [V3(pD13.x, pD13.y + 0.004, pD13.z), arco, pt(C2_AMA, 'A', alto), pt(C2_AMA, 'B', alto), pt(C2_AMA, 'B', yR),
    pt(C2_RES, 'B', yR), pt(C2_RES, 'B', alto), pt(C2_RES, 'D', alto), V3((pbX(C2_RES) + pbX(C2_LED)) / 2, PB.y + 0.0105, zD),
    pt(C2_LED, 'D', alto), pt(C2_LED, 'A', alto), pbRiel(.131, C2_RIEL_LED)];
  ruta.forEach((v, i) => { if (i > 1) v.y = Math.max(v.y, alto); });
  const largos = [0]; ruta.forEach((v, i) => { if (i) largos.push(largos[i - 1] + v.distanceTo(ruta[i - 1])); });
  const total = largos[largos.length - 1];
  const puntoRuta = (u, sal) => {
    const d = u * total; let i = 1;
    while (i < ruta.length - 1 && largos[i] < d) i++;
    return sal.lerpVectors(ruta[i - 1], ruta[i], (d - largos[i - 1]) / (largos[i] - largos[i - 1] || 1));
  };
  const puntos = new THREE.Group();
  const flujo = [0, 1, 2, 3, 4, 5, 6, 7].map(() => chispa(puntos, 0xfff1a8, 0.0007));

  // [grupo, paso en que aparece, retraso]
  const partes = [[gUno, 1, 0], [gAma, 2, 0], [gRes, 3, 0], [gLed, 4, 0], [gBtn, 5, 0], [gNar, 5, 0.7],
    [gGnd, 6, 0], [cBtn, 6, 0.6], [cLed, 6, 1.2]];
  centro.add(gUno, gAma, gNar, gGnd, gRes, gLed, gBtn, dedo, cBtn, cLed, etiquetas, puntos);

  // ---- Materiales: todas las piezas girando en un anillo ----
  const gMat = new THREE.Group();
  gMat.visible = false;
  grupo.add(gMat);
  const lista = [[clonMat.uno, 0.26], [clonMat.tab, 0.30], [clonMat.res, 0.15], [crearLED(0xff3b30), 0.12],
    [clonMat.pul, 0.10], [amarillo.clone(true), 0.17], [cNegro.clone(true), 0.17]];
  const itemsMat = lista.map(([modelo, tamM], i) => {
    const caja = new THREE.Box3().setFromObject(modelo), t = caja.getSize(new THREE.Vector3());
    modelo.position.sub(caja.getCenter(new THREE.Vector3()));
    const orientM = new THREE.Group();
    orientM.add(modelo);
    const anc = new THREE.Group();
    anc.add(orientM);
    anc.scale.setScalar(tamM / Math.max(t.x, t.y, t.z));
    gMat.add(anc);
    return { anc, orientM, ang0: (i / lista.length) * Math.PI * 2, giro: i * 1.7, vel: 0.6 + (i % 2) * 0.25 };
  });

  const mostrar = () => {};

  const tmp = new THREE.Vector3();
  const tick = (st, t) => {
    partes.forEach(([g, ini, ret]) => {
      const llega = st === ini ? facil(clamp01((t - ret) / 0.55)) : 1;
      g.visible = st >= ini && !(st === ini && t < ret);
      g.position.y = (g.userData.y0 || 0) + (1 - llega) * 0.012;
    });
    etiquetas.visible = st >= 1;
    // Ciclo de 3 s: suelto (LED apagado) → el dedo aprieta (LED prendido) → suelta
    const ciclo = t % 3;
    const bajar = st >= 7 ? (ciclo < 2.8 ? suave((ciclo - 1.2) / 0.3) : 1 - suave((ciclo - 2.8) / 0.2)) : 0;
    dedo.visible = st >= 7;
    dedo.position.y = yTopeBtn + (1 - bajar) * 0.012;
    const on = st >= 7 && bajar > 0.98;
    ledMat.emissiveIntensity = on ? 1.5 + 0.3 * Math.sin(t * 9) : 0.05;
    halo.material.opacity = on ? 0.3 + 0.08 * Math.sin(t * 9) : 0;
    puntos.visible = on;
    if (on) flujo.forEach((s, i) => s.position.copy(puntoRuta((t * 0.4 + i / 8) % 1, tmp)));
  };

  // Botones: Volver (al LED intermitente) a la izquierda, Avanzar a la derecha
  const ESC = 0.95, hueco = 0.06, yBotones = -0.62;
  const gVolver = centrado(volver.clone(true));
  const gAvanzar = centrado(avanzar);
  const wV = new THREE.Box3().setFromObject(gVolver).getSize(new THREE.Vector3()).x;
  const wA = new THREE.Box3().setFromObject(gAvanzar).getSize(new THREE.Vector3()).x;
  gVolver.position.set(-(hueco / 2 + (wV * ESC) / 2), yBotones, 0);
  gAvanzar.position.set(hueco / 2 + (wA * ESC) / 2, yBotones, 0);
  marcarBoton(gVolver, 'circuito', ESC);
  marcarBoton(gAvanzar, 'circuito3', ESC);
  grupo.add(gVolver, gAvanzar);
  grupo.position.y = 0.07;

  const soporte = new THREE.Group();
  soporte.add(grupo);
  soporte.userData.escala = 1 / 1.3;
  soporte.scale.setScalar(soporte.userData.escala);

  const botonesBase = [gVolver, gAvanzar, anclaje];
  const cont = {
    grupo, orient, anclaje, animables: [gVolver, gAvanzar], botonesBase, mostrar, tick, gMat, itemsMat, ang: 0,
    paginas: CIR2_PAGINAS, stFinal: 7,
    tam: TAM, escalaNorm, sel: -1, pag: 0, k: 0, visBtn: 1, zoom: 1, tocado: 0, t0: 0, giro: 0
  };
  return { soporte, botones: [...botonesBase], animables: cont.animables, flotantes: [], cont };
}

// Resistencia hecha por código (10 kΩ: café, negro, naranja), tendida a lo largo del eje X
function crearRes10k(L) {
  const g = new THREE.Group();
  const cuerpo = new THREE.Mesh(new THREE.CapsuleGeometry(0.0012, 0.0045, 4, 12), mat(0xd9b98a, 0.55));
  cuerpo.rotation.z = Math.PI / 2;
  g.add(cuerpo);
  for (const [x, color] of [[-0.0022, 0x6b3a1e], [-0.001, 0x111111], [0.0002, 0xff8c1a], [0.002, 0xd4af37]]) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.00126, 0.00126, 0.0007, 14), mat(color, 0.4));
    b.rotation.z = Math.PI / 2;
    b.position.x = x;
    g.add(b);
  }
  const alambre = new THREE.Mesh(new THREE.CylinderGeometry(0.0002, 0.0002, L, 8), mat(0xc8ccd4, 0.3, 0.9));
  alambre.rotation.z = Math.PI / 2;
  g.add(alambre);
  return g;
}

function armarCircuito3(volver, avanzar, tablero, mega, resis, cNegro, amarillo, ldr) {
  const grupo = new THREE.Group();
  const clonMat = { mega: mega.clone(true), res: resis.clone(true), tab: tablero.clone(true), ldr: ldr.clone(true) };
  const orient = new THREE.Group();
  const centro = new THREE.Group();
  centro.position.y = -PB.y / 2;
  centro.position.z = 0.0286;                 // el Mega queda detrás: se recentra todo el conjunto
  centro.add(tablero);
  orient.add(centro);

  const TAM = 0.95, escalaNorm = TAM / PB.ancho;
  const anclaje = new THREE.Group();
  anclaje.add(orient);
  anclaje.scale.setScalar(escalaNorm);
  anclaje.position.set(0, 0.08, 0);
  anclaje.userData.alTocar = () => abrirCir();
  anclaje.userData.sinLatido = true;
  grupo.add(anclaje);

  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const plata = mat(0xc8ccd4, 0.3, 0.9);
  const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
  const suave = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };
  const cil = (g, mt, r, p0, p1) => {
    const d = new THREE.Vector3().subVectors(p1, p0);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mt);
    c.position.copy(p0).addScaledVector(d, 0.5);
    c.quaternion.setFromUnitVectors(EJE_Y, d.normalize());
    g.add(c);
  };
  const chispa = (g, color, r) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color, toneMapped: false }));
    g.add(e);
    return e;
  };
  const zB = pbZ(PB.filas.B), zC = pbZ(PB.filas.C), zD = pbZ(PB.filas.D);

  // ---- Arduino Mega: largo hacia la derecha, USB a la izquierda, con sus pines de energía y A0 mirando a la protoboard ----
  const gMega = new THREE.Group();
  mega.position.set(0, 0, 0);
  mega.rotation.y = 0;
  mega.updateMatrixWorld(true);
  let tam = new THREE.Box3().setFromObject(mega).getSize(new THREE.Vector3());
  mega.rotation.y = (tam.z > tam.x ? Math.PI / 2 : 0) + (MEGA_INVERTIR ? Math.PI : 0);
  mega.updateMatrixWorld(true);
  tam = new THREE.Box3().setFromObject(mega).getSize(new THREE.Vector3());
  mega.scale.setScalar(0.0533 / tam.z);          // 53,3 mm de ancho real
  mega.updateMatrixWorld(true);
  const cajaM = new THREE.Box3().setFromObject(mega);
  const mm = 0.001;
  const zBorde = -PB.alto / 2 - 0.004;           // borde del Mega junto a la protoboard (a 4 mm)
  const xR = pbX(40) + MEGA_PIN.a0 * mm;         // extremo derecho del Mega (A0 queda sobre la columna 40)
  mega.position.set(xR - cajaM.max.x, -cajaM.min.y, zBorde - cajaM.max.z);
  gMega.add(mega);
  const pinAbajo = (dmm) => V3(xR - dmm * mm, MEGA_PIN.alto * mm, zBorde - MEGA_PIN.borde * mm);
  const pinArriba = (dmm) => V3(xR - dmm * mm, MEGA_PIN.alto * mm, zBorde - 0.0533 + MEGA_PIN.borde * mm);
  const pA0 = pinAbajo(MEGA_PIN.a0), p5V = pinAbajo(MEGA_PIN.v5), pGND = pinAbajo(MEGA_PIN.gnd), pD13 = pinArriba(MEGA_PIN.d13);

  // Cable "al aire" (con arco): del pin del Mega a un hueco de la protoboard
  const alambre = (color, a, b, alto) => {
    const g = new THREE.Group(), m = mat(color, 0.45);
    const p0 = V3(a.x, a.y + 0.004, a.z), p2 = V3(b.x, b.y + 0.004, b.z);
    const p1 = p0.clone().lerp(p2, 0.5);
    p1.y = Math.max(p0.y, p2.y) + alto * 2;
    const curva = new THREE.QuadraticBezierCurve3(p0, p1, p2);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 36, 0.0006, 8, false), m));
    for (const p of [a, b]) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.0026, 0.0044, 0.0026), m);
      t.position.set(p.x, p.y + 0.0007, p.z);
      g.add(t);
    }
    g.userData.curva = curva;
    return g;
  };
  const gAma = alambre(0xffd60a, pD13, pbHoyo(C3_AMA, 'A'), 0.014);       // pin 13 (borde de arriba): pasa por encima del Mega
  const gRoj = alambre(0xd9261c, p5V, pbHoyo(C3_LDR_A, 'A'), 0.006);
  const gVer = alambre(0x2ecc40, pA0, pbHoyo(C3_LDR_B, 'A'), 0.006);
  const gGnd = alambre(0x15151a, pGND, pbRiel(.131, C3_RIEL_GND), 0.005);

  // ---- Resistencia de 220 Ω: de la columna 24 a la 34 (fila B) ----
  const gRes = new THREE.Group();
  const yR = PB.y + 0.0045, x1 = pbX(C3_AMA), x2 = pbX(C3_RES);
  resis.position.set((x1 + x2) / 2, yR - 0.00154, zB);
  gRes.add(resis);
  cil(gRes, plata, 0.00022, V3(x1, PB.y - 0.002, zB), V3(x1, yR, zB));
  cil(gRes, plata, 0.00022, V3(x2, PB.y - 0.002, zB), V3(x2, yR, zB));

  // ---- LED: pata larga en la 34, corta en la 35 (fila D) ----

    color: 0xff4a3a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
  }));
  { const xa = pbX(C3_RES), xc = pbX(C3_LED), xm = (xa + xc) / 2, yb = PB.y + 0.0085;
    cil(gLed, plata, 0.00018, V3(xa, PB.y - 0.002, zD), V3(xa, yb + 0.0015, zD));
    cil(gLed, plata, 0.00018, V3(xc, PB.y - 0.002, zD), V3(xc, yb, zD));
    const cu = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 0.0055, 20), ledMat);
    cu.position.set(xm, yb + 0.00275, zD);
    const dom = new THREE.Mesh(new THREE.SphereGeometry(0.0025, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), ledMat);
    dom.position.set(xm, yb + 0.0055, zD);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.00295, 0.00295, 0.0006, 20), ledMat);
    base.position.set(xm, yb + 0.0003, zD);
    halo.position.set(xm, yb + 0.0045, zD);
    gLed.add(cu, dom, base, halo);
  }

  // ---- Fotorresistencia: patas en las columnas 44 y 46 (fila C) ----
  const gLdr = new THREE.Group();
  const ldrX = (pbX(C3_LDR_A) + pbX(C3_LDR_B)) / 2, ldrYb = PB.y + 0.0055, ldrTope = ldrYb + 0.0013;
  { const xa = pbX(C3_LDR_A), xc = pbX(C3_LDR_B);
    cil(gLdr, plata, 0.00018, V3(xa, PB.y - 0.002, zC), V3(xa, ldrYb + 0.0004, zC));
    cil(gLdr, plata, 0.00018, V3(xc, PB.y - 0.002, zC), V3(xc, ldrYb + 0.0004, zC));
    const aro = new THREE.Mesh(new THREE.CylinderGeometry(0.00285, 0.00285, 0.0012, 28), mat(0xb9bcc4, 0.35, 0.8));
    aro.position.set(ldrX, ldrYb + 0.0006, zC);
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.fillStyle = '#d98a34'; c2.fillRect(0, 0, 128, 128);
    c2.strokeStyle = '#5a2d0c'; c2.lineWidth = 8; c2.lineJoin = 'round';
    c2.beginPath(); c2.moveTo(22, 18);
    for (let i = 0; i < 6; i++) { const y = 18 + i * 18, xe = i % 2 === 0 ? 106 : 22; c2.lineTo(xe, y); c2.lineTo(xe, y + 18); }
    c2.stroke();
    const tx = new THREE.CanvasTexture(cv);
    tx.colorSpace = THREE.SRGBColorSpace;
    const cara = new THREE.Mesh(new THREE.CircleGeometry(0.0027, 28), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.5 }));
    cara.rotation.x = -Math.PI / 2;
    cara.position.set(ldrX, ldrTope + 0.00012, zC);
    gLdr.add(aro, cara);
  }

  // ---- Resistencia de 10 kΩ: de la columna 46 a la 56 (fila B) ----
  const gR10 = new THREE.Group();
  { const xa = pbX(C3_LDR_B), xb = pbX(C3_R10);
    const r = crearRes10k(xb - xa);
    r.position.set((xa + xb) / 2, yR, zB);
    gR10.add(r);
    cil(gR10, plata, 0.00022, V3(xa, PB.y - 0.002, zB), V3(xa, yR, zB));
    cil(gR10, plata, 0.00022, V3(xb, PB.y - 0.002, zB), V3(xb, yR, zB));
  }

  // ---- Cables negros (al riel azul) ----
  const cable = (a, b) => {
    const g = new THREE.Group(), m = cNegro.clone(true);
    g.add(m);
    g.position.set((a.x + b.x) / 2, PB.y - 0.002, (a.z + b.z) / 2);
    g.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
    m.scale.x = Math.hypot(b.x - a.x, b.z - a.z) / 0.01016;
    g.userData.y0 = g.position.y;
    return g;
  };
  const cLed = cable(pbHoyo(C3_LED, 'A'), pbRiel(.131, C3_RIEL_LED));
  const cDiv = cable(pbHoyo(C3_R10, 'A'), pbRiel(.131, C3_RIEL_DIV));

  // ---- Mano que tapa el sensor y solcito que aparece cuando hay luz ----
  const mano = new THREE.Group();
  const palma = new THREE.Mesh(new THREE.CapsuleGeometry(0.0045, 0.010, 4, 14), mat(0xf2c7a5, 0.6));
  palma.rotation.z = Math.PI / 2;
  palma.scale.set(0.55, 1, 1);
  mano.add(palma);
  mano.position.set(ldrX, ldrTope, zC);
  mano.visible = false;
  const sol = (() => {
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.strokeStyle = '#ffd60a'; c2.lineWidth = 9; c2.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      c2.beginPath(); c2.moveTo(64 + Math.cos(a) * 36, 64 + Math.sin(a) * 36); c2.lineTo(64 + Math.cos(a) * 56, 64 + Math.sin(a) * 56); c2.stroke();
    }
    c2.fillStyle = '#ffd60a'; c2.beginPath(); c2.arc(64, 64, 26, 0, Math.PI * 2); c2.fill();
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, toneMapped: false }));
    sp.scale.set(0.012, 0.012, 1);
    sp.position.set(ldrX, ldrTope + 0.028, zC);
    sp.visible = false;
    return sp;
  })();

  // ---- Etiquetas: D13, A0, 5V y GND sobre el Mega ----
  const etiquetas = new THREE.Group();
  const etiqueta = (txt, color, p) => {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.font = '800 84px Manrope, sans-serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillStyle = color; c2.fillText(txt, 128, 64);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, toneMapped: false }));
    sp.scale.set(0.022, 0.011, 1);
    sp.position.set(p.x, p.y + 0.011, p.z - 0.006);
    etiquetas.add(sp);
  };
  etiqueta('D13', '#ffd60a', pD13);
  etiqueta('A0', '#6ee06e', pA0);
  etiqueta('5V', '#ff6b5e', p5V);
  etiqueta('GND', '#e9f3f1', pGND);

  // ---- Recorrido de la corriente (LED): D13 → cable amarillo → resistencia → LED → cable negro → riel (−) ----
  const pt = (c, f, y) => { const v = pbHoyo(c, f); v.y = y; return v; };
  const alto = PB.y + 0.0012;
  const ruta = [...gAma.userData.curva.getPoints(12), pt(C3_AMA, 'A', alto), pt(C3_AMA, 'B', alto), pt(C3_AMA, 'B', yR),
    pt(C3_RES, 'B', yR), pt(C3_RES, 'B', alto), pt(C3_RES, 'D', alto), V3((pbX(C3_RES) + pbX(C3_LED)) / 2, PB.y + 0.0105, zD),
    pt(C3_LED, 'D', alto), pt(C3_LED, 'A', alto), pbRiel(.131, C3_RIEL_LED)];
  const largos = [0]; ruta.forEach((v, i) => { if (i) largos.push(largos[i - 1] + v.distanceTo(ruta[i - 1])); });
  const total = largos[largos.length - 1];
  const puntoRuta = (u, sal) => {
    const d = u * total; let i = 1;
    while (i < ruta.length - 1 && largos[i] < d) i++;
    return sal.lerpVectors(ruta[i - 1], ruta[i], (d - largos[i - 1]) / (largos[i] - largos[i - 1] || 1));
  };
  const puntos = new THREE.Group();
  const flujo = Array.from({ length: 10 }, () => chispa(puntos, 0xfff1a8, 0.0007));

  // [grupo, paso en que aparece, retraso]
  const partes = [[gMega, 1, 0], [gAma, 2, 0], [gRes, 2, 0.5], [gLed, 2, 1.0], [gGnd, 3, 0], [cLed, 3, 0.6],
    [gLdr, 4, 0], [gR10, 5, 0], [cDiv, 5, 0.6], [gRoj, 6, 0], [gVer, 6, 0.7]];
  centro.add(gMega, gAma, gRoj, gVer, gGnd, gRes, gLed, gLdr, gR10, cLed, cDiv, mano, sol, etiquetas, puntos);

  // ---- Materiales: todas las piezas girando en un anillo ----
  const gMat = new THREE.Group();
  gMat.visible = false;
  grupo.add(gMat);
  const lista = [[clonMat.mega, 0.28], [clonMat.tab, 0.30], [clonMat.ldr, 0.12], [crearRes10k(0.02), 0.15],
    [clonMat.res, 0.15], [crearLED(0xff3b30), 0.12], [amarillo.clone(true), 0.17], [cNegro.clone(true), 0.17]];
  const itemsMat = lista.map(([modelo, tamM], i) => {
    const caja = new THREE.Box3().setFromObject(modelo), t = caja.getSize(new THREE.Vector3());
    modelo.position.sub(caja.getCenter(new THREE.Vector3()));
    const orientM = new THREE.Group();
    orientM.add(modelo);
    const anc = new THREE.Group();
    anc.add(orientM);
    anc.scale.setScalar(tamM / Math.max(t.x, t.y, t.z));
    gMat.add(anc);
    return { anc, orientM, ang0: (i / lista.length) * Math.PI * 2, giro: i * 1.7, vel: 0.6 + (i % 2) * 0.25 };
  });

  const mostrar = () => {};

  const tmp = new THREE.Vector3();
  const tick = (st, t) => {
    partes.forEach(([g, ini, ret]) => {
      const llega = st === ini ? facil(clamp01((t - ret) / 0.55)) : 1;
      g.visible = st >= ini && !(st === ini && t < ret);
      g.position.y = (g.userData.y0 || 0) + (1 - llega) * 0.012;
    });
    etiquetas.visible = st >= 1;
    // Ciclo de 5 s: hay luz (LED apagado) → la mano tapa el sensor (LED prendido) → la mano se va
    const ciclo = t % 5;
    const tapa = st >= 7 ? (ciclo < 4 ? suave((ciclo - 1.5) / 0.4) : 1 - suave((ciclo - 4) / 0.4)) : 0;
    mano.visible = st >= 7;
    mano.position.y = ldrTope + 0.0032 + (1 - tapa) * 0.014;
    sol.visible = st >= 7 && tapa < 0.4;
    const on = st >= 7 && tapa > 0.98;
    ledMat.emissiveIntensity = on ? 1.5 + 0.3 * Math.sin(t * 9) : 0.05;
    halo.material.opacity = on ? 0.3 + 0.08 * Math.sin(t * 9) : 0;
    puntos.visible = on;
    if (on) flujo.forEach((s, i) => s.position.copy(puntoRuta((t * 0.4 + i / 10) % 1, tmp)));
  };

  // Botones: Volver (al LED con pulsador) a la izquierda, Avanzar a la derecha
  const ESC = 0.95, hueco = 0.06, yBotones = -0.62;
  const gVolver = centrado(volver.clone(true));
  const gAvanzar = centrado(avanzar);
  const wV = new THREE.Box3().setFromObject(gVolver).getSize(new THREE.Vector3()).x;
  const wA = new THREE.Box3().setFromObject(gAvanzar).getSize(new THREE.Vector3()).x;
  gVolver.position.set(-(hueco / 2 + (wV * ESC) / 2), yBotones, 0);
  gAvanzar.position.set(hueco / 2 + (wA * ESC) / 2, yBotones, 0);
  marcarBoton(gVolver, 'circuito2', ESC);
  marcarBoton(gAvanzar, 'siguiente', ESC);
  grupo.add(gVolver, gAvanzar);
  grupo.position.y = 0.07;

  const soporte = new THREE.Group();
  soporte.add(grupo);
  soporte.userData.escala = 1 / 1.3;
  soporte.scale.setScalar(soporte.userData.escala);

  const botonesBase = [gVolver, gAvanzar, anclaje];
  const cont = {
    grupo, orient, anclaje, animables: [gVolver, gAvanzar], botonesBase, mostrar, tick, gMat, itemsMat, ang: 0,
    paginas: CIR3_PAGINAS, stFinal: 7,
    tam: TAM, escalaNorm, sel: -1, pag: 0, k: 0, visBtn: 1, zoom: 1, tocado: 0, t0: 0, giro: 0
  };
  return { soporte, botones: [...botonesBase], animables: cont.animables, flotantes: [], cont };
}

// ---------- Medalla 3D (hecha por código): disco con borde, estrella en relieve, tachuelas y cinta ----------
function crearMedalla(i) {
  const d = MEDALLAS[i];
  const g = new THREE.Group();
  const metal = (c, r = 0.25) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0.95 });

  // Cinta (dos tiras en V, detrás del disco)
  [[-1, d.cinta[0]], [1, d.cinta[1]]].forEach(([lado, color]) => {
    const f = new THREE.Shape();
    f.moveTo(-0.11, 0); f.lineTo(0.11, 0); f.lineTo(0.11, 0.72); f.lineTo(0, 0.64); f.lineTo(-0.11, 0.72); f.closePath();
    const tira = new THREE.Mesh(
      new THREE.ExtrudeGeometry(f, { depth: 0.02, bevelEnabled: false }),
      new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05 })
    );
    tira.position.set(lado * 0.07, 0.36, -0.045);
    tira.rotation.z = -lado * 0.3;
    g.add(tira);
  });

  const disco = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.08, 72), metal(d.cuerpo));
  disco.rotation.x = Math.PI / 2;
  g.add(disco);
  for (const z of [0.04, -0.04]) {
    const aro = new THREE.Mesh(new THREE.TorusGeometry(0.47, 0.04, 16, 80), metal(d.borde, 0.2));
    aro.position.z = z;
    g.add(aro);
  }
  const placa = new THREE.Mesh(new THREE.CylinderGeometry(0.41, 0.41, 0.02, 72), metal(d.cuerpo, 0.42));
  placa.rotation.x = Math.PI / 2;
  placa.position.z = 0.045;
  g.add(placa);

  // Estrella en relieve
  const e = new THREE.Shape();
  for (let k = 0; k < 10; k++) {
    const r = k % 2 ? 0.11 : 0.27, a = Math.PI / 2 + (k * Math.PI) / 5;
    k === 0 ? e.moveTo(Math.cos(a) * r, Math.sin(a) * r) : e.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  e.closePath();
  const estrella = new THREE.Mesh(
    new THREE.ExtrudeGeometry(e, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 }),
    metal(d.estrella, 0.16)
  );
  estrella.position.z = 0.056;
  estrella.position.y = -0.01;
  g.add(estrella);

  // Tachuelas alrededor (como los nodos de un circuito)
  const tachuela = new THREE.SphereGeometry(0.02, 12, 10);
  const mt = metal(d.borde, 0.2);
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * Math.PI * 2;
    const t = new THREE.Mesh(tachuela, mt);
    t.position.set(Math.cos(a) * 0.35, Math.sin(a) * 0.35, 0.062);
    g.add(t);
  }

  const caja = new THREE.Box3().setFromObject(g);
  const tam = caja.getSize(new THREE.Vector3());
  const c = caja.getCenter(new THREE.Vector3());
  g.children.forEach((h) => h.position.sub(c));
  const w = new THREE.Group();
  w.add(g);
  w.userData.dim = Math.max(tam.x, tam.y, tam.z);
  return w;
}

// ---------- Botón 3D redondeado con texto (para elegir el modo) ----------
function crearBotonModo(titulo, sub, c1, c2, icono, alTocar) {
  const W = 0.64, Hh = 0.13, R = 0.045;
  const f = new THREE.Shape();
  f.moveTo(-W / 2 + R, -Hh / 2); f.lineTo(W / 2 - R, -Hh / 2); f.quadraticCurveTo(W / 2, -Hh / 2, W / 2, -Hh / 2 + R);
  f.lineTo(W / 2, Hh / 2 - R); f.quadraticCurveTo(W / 2, Hh / 2, W / 2 - R, Hh / 2); f.lineTo(-W / 2 + R, Hh / 2);
  f.quadraticCurveTo(-W / 2, Hh / 2, -W / 2, Hh / 2 - R); f.lineTo(-W / 2, -Hh / 2 + R); f.quadraticCurveTo(-W / 2, -Hh / 2, -W / 2 + R, -Hh / 2);
  const geo = new THREE.ExtrudeGeometry(f, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelSegments: 3, curveSegments: 10 });
  geo.translate(0, 0, -0.015);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(c2), roughness: 0.35, metalness: 0.15 })));

  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 208;
  const x = cv.getContext('2d');
  const redondo = (px, py, w, h, r) => {
    x.beginPath(); x.moveTo(px + r, py); x.lineTo(px + w - r, py); x.quadraticCurveTo(px + w, py, px + w, py + r);
    x.lineTo(px + w, py + h - r); x.quadraticCurveTo(px + w, py + h, px + w - r, py + h); x.lineTo(px + r, py + h);
    x.quadraticCurveTo(px, py + h, px, py + h - r); x.lineTo(px, py + r); x.quadraticCurveTo(px, py, px + r, py);
    x.closePath();
  };
  const dibujar = () => {
    x.clearRect(0, 0, 1024, 208);
    const gr = x.createLinearGradient(0, 0, 0, 208);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    redondo(0, 0, 1024, 208, 84); x.fillStyle = gr; x.fill();
    // brillo suave arriba
    const br = x.createLinearGradient(0, 0, 0, 100);
    br.addColorStop(0, 'rgba(255,255,255,0.38)'); br.addColorStop(1, 'rgba(255,255,255,0)');
    redondo(14, 10, 996, 96, 60); x.fillStyle = br; x.fill();
    // icono
    x.fillStyle = 'rgba(255,255,255,0.22)'; x.beginPath(); x.arc(118, 104, 66, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff';
    if (icono === 'hoja') {
      x.beginPath(); x.moveTo(86, 138); x.bezierCurveTo(78, 80, 122, 58, 152, 68); x.bezierCurveTo(158, 110, 130, 144, 86, 138); x.fill();
      x.strokeStyle = c2; x.lineWidth = 6; x.lineCap = 'round';
      x.beginPath(); x.moveTo(90, 134); x.lineTo(138, 82); x.stroke();
    } else {
      x.beginPath(); x.moveTo(128, 48); x.lineTo(88, 112); x.lineTo(112, 112); x.lineTo(98, 162); x.lineTo(148, 92); x.lineTo(122, 92); x.lineTo(138, 48); x.closePath(); x.fill();
    }
    x.textAlign = 'left'; x.textBaseline = 'middle';
    x.font = '800 68px Manrope, "Segoe UI", Arial, sans-serif'; x.fillStyle = '#fff';
    x.fillText(titulo, 224, 84);
    x.font = '600 36px Manrope, "Segoe UI", Arial, sans-serif'; x.fillStyle = 'rgba(255,255,255,0.9)';
    x.fillText(sub, 226, 146);
  };
  dibujar();
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 4;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dibujar(); tx.needsUpdate = true; });
  const cara = new THREE.Mesh(
    new THREE.PlaneGeometry(W * 0.985, (W * 0.985 * 208) / 1024),
    new THREE.MeshBasicMaterial({ map: tx, transparent: true, toneMapped: false })
  );
  cara.position.z = 0.0258;
  g.add(cara);
  g.userData.alTocar = alTocar;
  g.userData.escalaBase = 1;
  return g;
}

// ---------- Escena: medalla, botones de modo, y el "escenario" donde se muestran las preguntas ----------
function armarEvaluacion(volver, finalizar, comps, tablero, cRojo, cNegro) {
  const grupo = new THREE.Group();
  const orient = new THREE.Group();
  const anclaje = new THREE.Group();
  anclaje.add(orient);
  grupo.add(anclaje);

  const contenidos = {};
  const reg = (clave, obj, dim, f, modo) => {
    obj.visible = false;
    orient.add(obj);
    contenidos[clave] = { obj, dim, f, modo };
  };

  // Componentes (para las preguntas "¿qué componente es?")
  comps.forEach((modelo, i) => {
    const caja = new THREE.Box3().setFromObject(modelo);
    const t = caja.getSize(new THREE.Vector3());
    modelo.position.sub(caja.getCenter(new THREE.Vector3()));
    const w = new THREE.Group();
    w.add(modelo);
    reg('c' + i, w, Math.max(t.x, t.y, t.z), 1, 'giro');
  });

  // Medallas (oro, plata, bronce, ánimo)
  MEDALLAS.forEach((_, i) => {
    const m = crearMedalla(i);
    reg('m' + i, m, m.userData.dim, 1.05, 'medalla');
  });

  // ----- Protoboard con resaltados y circuitos (para preguntas de la protoboard y de predecir) -----
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const plata = mat(0xc8ccd4, 0.3, 0.9);
  const centro = new THREE.Group();
  centro.position.y = -PB.y / 2;
  centro.add(tablero);
  const wPlaca = new THREE.Group();
  wPlaca.add(centro);
  reg('placa', wPlaca, PB.ancho, 1.4, 'placa');

  const G = {};
  for (const n of ['ring', 'col', 'canal', 'rojo', 'azul', 'circ']) {
    G[n] = new THREE.Group();
    G[n].visible = false;
    centro.add(G[n]);
  }
  const op = (m, v) => { m.material.opacity = v; };
  const brillo = (g, color, o = 0.4) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: o, depthWrite: false, blending: THREE.AdditiveBlending,
      toneMapped: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = PB.y + 0.0004;
    g.add(m);
    return m;
  };
  const poner = (m, x0, x1, z0, z1) => {
    m.position.x = (x0 + x1) / 2; m.position.z = (z0 + z1) / 2;
    m.scale.set(Math.abs(x1 - x0), Math.abs(z1 - z0), 1);
  };
  const chispa = (g, color, r = 0.0009) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color, toneMapped: false }));
    g.add(e);
    return e;
  };
  const cil = (g, mt, r, p0, p1) => {
    const d = new THREE.Vector3().subVectors(p1, p0);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mt);
    c.position.copy(p0).addScaledVector(d, 0.5);
    c.quaternion.setFromUnitVectors(EJE_Y, d.normalize());
    g.add(c);
  };
  const zA = pbZ(PB.filas.A), zB = pbZ(PB.filas.B), zC = pbZ(PB.filas.C), zD = pbZ(PB.filas.D), zE = pbZ(PB.filas.E);
  const zF = pbZ(PB.filas.F), zJ = pbZ(PB.filas.J);

  // Hueco D15 con aro que late
  const aro = new THREE.Mesh(new THREE.RingGeometry(0.0017, 0.0024, 32), new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide
  }));
  aro.rotation.x = -Math.PI / 2;
  aro.position.set(pbX(15), PB.y + 0.0007, pbZ(PB.filas.D));
  G.ring.add(aro);
  const disco = new THREE.Mesh(new THREE.CircleGeometry(0.0021, 24), new THREE.MeshBasicMaterial({
    color: 0x4dd0ff, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
  }));
  disco.rotation.x = -Math.PI / 2;
  disco.position.set(pbX(15), PB.y + 0.0006, pbZ(PB.filas.D));
  G.ring.add(disco);

  // Columna (arriba amarillo, abajo verde) con chispitas
  const colA = brillo(G.col, 0xffd60a), colB = brillo(G.col, 0x34c759);
  colA.scale.set(0.0023, zE - zA + 0.0028, 1); colA.position.set(pbX(31), PB.y + 0.0004, (zA + zE) / 2);
  colB.scale.set(0.0023, zJ - zF + 0.0028, 1); colB.position.set(pbX(31), PB.y + 0.0004, (zF + zJ) / 2);
  const sa = [0, 1, 2].map(() => chispa(G.col, 0xfff3b0));
  const sb = [0, 1, 2].map(() => chispa(G.col, 0xc9ffd6));

  // Canal del centro
  const canal = brillo(G.canal, 0xff9f0a, 0.3);
  poner(canal, pbU(0.05), pbU(0.95), pbZ(0.442), pbZ(0.558));

  // Líneas rojas y azules
  const tira = (g, v, color) => {
    const s = brillo(g, color, 0.5);
    poner(s, pbU(PB.rIni) - 0.0015, pbU(PB.rFin) + 0.0015, pbZ(v) - 0.0014, pbZ(v) + 0.0014);
    return s;
  };
  const rojas = [tira(G.rojo, 0.084, 0xff3b30), tira(G.rojo, 0.916, 0xff3b30)];
  const azules = [tira(G.azul, 0.131, 0x3b82ff), tira(G.azul, 0.869, 0x3b82ff)];

  const cable = (modelo, a, b) => {

  const txH = new THREE.CanvasTexture(cvH);

  return { soporte, botones: [...botonesBase], animables: cont.animables, flotantes: [], cont };
}

const MEZCLAR = (arr) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
function armarOpciones(correcta, falsas) {
  const opciones = MEZCLAR([correcta, ...falsas]);
  return { opciones, correcta: opciones.indexOf(correcta) };
}
const ic = (clave) => COMPONENTES.findIndex((c) => c.clave === clave);

// 10 preguntas, de la más fácil a la más difícil: 4 de componentes, 2 de protoboard, 2 de verdadero/falso, 2 de predecir
function generarPreguntas() {
  const q = [];
  const idx = MEZCLAR(COMPONENTES.map((_, i) => i));
  idx.slice(0, 4).forEach((i, k) => {
    const f = COMPONENTES[i].ficha;
    const otros = MEZCLAR(idx.filter((j) => j !== i)).slice(0, 3);
    if (k < 2) {
      q.push({ tipo: 'comp', texto: '¿Cómo se llama este componente?', ...armarOpciones(f.nombre, otros.map((j) => COMPONENTES[j].ficha.nombre)),
        explicacion: f.nombre + ': ' + f.lema, vis: { t: 'comp', i }, repasar: 'contenido' });
    } else {
      q.push({ tipo: 'comp', texto: 'Este componente es: ' + f.nombre + '. ¿Para qué sirve?', ...armarOpciones(f.lema, otros.map((j) => COMPONENTES[j].ficha.lema)),
        explicacion: f.secciones[0][1], vis: { t: 'comp', i }, repasar: 'contenido' });
    }
  });
  MEZCLAR(EV_PROTO).slice(0, 2).forEach((p) => {
    q.push({ tipo: 'proto', texto: p.texto, ...armarOpciones(p.ok, p.mal), explicacion: p.e, vis: p.vis, repasar: 'protoboard' });
  });
  MEZCLAR(EV_VF).slice(0, 2).forEach((p) => {
    q.push({ tipo: 'vf', texto: 'Verdadero o falso: ' + p.t, opciones: ['Verdadero', 'Falso'], correcta: p.v ? 0 : 1,
      explicacion: p.e, vis: p.vis, repasar: p.rep });
  });
  MEZCLAR(EV_PRED).slice(0, 2).forEach((p) => {
    q.push({ tipo: 'pred', texto: 'Mira bien este circuito. Cuando lo conectes a la batería, ¿qué le pasa al LED?',
      ...armarOpciones(p.ok, EV_PRED_OPC.filter((o) => o !== p.ok)), explicacion: p.e, vis: { t: 'pred', v: p.v }, revela: p.revela, repasar: 'circuitos' });
  });
  return q;
}

// ---------- Panel de preguntas (HTML) ----------
const quizEl = $('quiz');
const qCuerpo = $('qCuerpo');
const qBarra = $('qTiempoBarra');
const qSegTxt = $('qSeg');
const elem = (tag, clase, texto) => {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
};

function mostrarPanel(si) {
  quizEl.hidden = !si;
  document.body.classList.toggle('detalle', si);
}

function iniciarEval(modo) {
  const c = evalEstado;
  if (!c) return;
  Object.assign(c, {
    modo, preguntas: generarPreguntas(), idx: 0, aciertos: 0, respuestas: [], pistas: modo === 'tranquilo' ? EV.pistas : 0,
    puntos: 0, racha: 0, mejorRacha: 0, estado: 'pregunta', sel: 0, zoom: 1, tocado: performance.now()
  });
  mundo.evaluacion.botones.length = 0;
  mostrarPanel(true);
  renderPregunta();
}

function actualizarPista() {
  const c = evalEstado, q = c.preguntas[c.idx];
  const malasVisibles = c.botonesOp.filter((b, k) => k !== q.correcta && !c.oculta.has(k)).length;
  const btn = $('qPista');
  btn.textContent = 'Pista (' + c.pistas + ')';
  btn.disabled = c.pistas <= 0 || malasVisibles <= 1;
}

function renderPregunta() {
  const c = evalEstado, q = c.preguntas[c.idx];
  c.resuelta = false;
  c.oculta = new Set();
  c.tq = performance.now();
  c.limite = EV.limite[q.tipo];
  c.mostrarVis(q.vis);
  c.tocado = performance.now();

  $('qModo').textContent = c.modo === 'reto' ? '⚡ Modo reto' : '🌿 Modo tranquilo';
  $('qProg').textContent = 'Pregunta ' + (c.idx + 1) + ' de ' + c.preguntas.length;
  $('qTiempo').hidden = c.modo !== 'reto';
  qSegTxt.textContent = c.modo === 'reto' ? c.limite + ' s' : '';
  qBarra.style.width = '100%';
  qBarra.style.background = '#34c759';

  qCuerpo.replaceChildren();
  qCuerpo.appendChild(elem('p', 'q-texto', q.texto));
  const ops = elem('div', 'q-ops');
  c.botonesOp = q.opciones.map((texto, k) => {
    const b = elem('button', 'q-op');
    b.type = 'button';
    b.appendChild(elem('b', '', String.fromCharCode(65 + k)));
    b.appendChild(elem('span', '', texto));
    b.addEventListener('click', () => responder(k));
    ops.appendChild(b);
    return b;
  });
  qCuerpo.appendChild(ops);
  const exp = elem('div', 'q-exp');
  exp.id = 'qExp';
  exp.hidden = true;
  qCuerpo.appendChild(exp);
  qCuerpo.scrollTop = 0;

  $('qSig').hidden = true;
  const pista = $('qPista');
  pista.hidden = c.modo !== 'tranquilo';
  if (c.modo === 'tranquilo') actualizarPista();
}

function responder(i) {
  const c = evalEstado;
  if (!c || c.resuelta || c.estado !== 'pregunta') return;
  const q = c.preguntas[c.idx];
  c.resuelta = true;
  const ok = i === q.correcta;
  const restante = Math.max(0, c.limite - (performance.now() - c.tq) / 1000);
  let pts = 0;
  if (ok) {
    c.aciertos++; c.racha++; c.mejorRacha = Math.max(c.mejorRacha, c.racha);
    if (c.modo === 'reto') { pts = 100 + Math.floor(restante) * 5 + (c.racha >= 3 ? 50 : 0); c.puntos += pts; }
  } else {
    c.racha = 0;
  }
  c.respuestas.push({ ok, elegida: i });

  c.botonesOp.forEach((b, k) => {
    b.disabled = true;
    if (k === q.correcta) b.classList.add('ok');
    else if (k === i) b.classList.add('mal');
  });
  const exp = $('qExp');
  exp.className = 'q-exp ' + (ok ? 'ok' : 'mal');
  exp.replaceChildren();
  exp.appendChild(elem('strong', '', ok ? '¡Correcto!' : (i < 0 ? '¡Se acabó el tiempo!' : 'Casi…')));
  exp.appendChild(document.createTextNode(q.explicacion));
  if (pts) exp.appendChild(elem('div', 'q-pts', '+' + pts + ' puntos' + (c.racha >= 3 ? ' · ¡racha de ' + c.racha + '!' : '')));
  exp.hidden = false;

  if (q.vis.t === 'pred') c.revelar(q.revela);
  $('qPista').hidden = true;
  const sig = $('qSig');
  sig.hidden = false;
  sig.textContent = c.idx === c.preguntas.length - 1 ? 'Ver resultado ›' : 'Siguiente ›';
  exp.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function pedirPista() {
  const c = evalEstado;
  if (!c || c.resuelta || c.pistas <= 0) return;
  const q = c.preguntas[c.idx];
  const malas = c.botonesOp.map((_, k) => k).filter((k) => k !== q.correcta && !c.oculta.has(k));
  if (malas.length <= 1) return;
  const k = malas[Math.floor(Math.random() * malas.length)];
  c.oculta.add(k);
  c.botonesOp[k].classList.add('oculta');
  c.botonesOp[k].disabled = true;
  c.pistas--;
  actualizarPista();
}

function siguientePregunta() {
  const c = evalEstado;
  c.idx++;
  if (c.idx < c.preguntas.length) renderPregunta();
  else terminarEval();
}

function terminarEval() {
  const c = evalEstado;
  c.estado = 'resultado';
  c.nivel = EV_NIVELES.findIndex((n) => c.aciertos >= n.min);
  c.mejor = c.mejor < 0 ? c.nivel : Math.min(c.mejor, c.nivel);
  c.mostrarVis({ t: 'medalla', n: c.nivel });
  c.tocado = performance.now();

  const nv = EV_NIVELES[c.nivel];
  $('qModo').textContent = c.modo === 'reto' ? '⚡ Modo reto' : '🌿 Modo tranquilo';
  $('qProg').textContent = 'Resultado';
  $('qTiempo').hidden = true;
  qSegTxt.textContent = '';

  qCuerpo.replaceChildren();
  const nota = elem('div', 'q-nota');
  nota.appendChild(elem('b', '', c.aciertos + ' / ' + c.preguntas.length));
  qCuerpo.appendChild(nota);
  qCuerpo.appendChild(elem('p', 'q-medalla', nv.medalla + ' · ' + nv.rol));
  qCuerpo.appendChild(elem('p', 'q-msj', nv.mensaje));
  if (c.modo === 'reto') {
    qCuerpo.appendChild(elem('p', 'q-reto', '⚡ Puntos del reto: ' + c.puntos.toLocaleString('es-EC') + ' · Mejor racha: ' + c.mejorRacha));
  }

  // Temas para repasar (agrupados)
  const fallos = {};
  c.preguntas.forEach((q, i) => { if (!c.respuestas[i].ok) fallos[q.repasar] = (fallos[q.repasar] || 0) + 1; });
  const claves = Object.keys(fallos);
  if (claves.length) {
    qCuerpo.appendChild(elem('h3', 'q-h3', 'Para repasar'));
    claves.forEach((esc) => {
      const fila = elem('div', 'q-rep');
      fila.appendChild(elem('span', '', EV_REPASO[esc] + ' · fallaste ' + fallos[esc]));
      const b = elem('button', 'boton secundario', 'Repasar ›');
      b.type = 'button';
      b.addEventListener('click', () => cambiarEscena(esc));
      fila.appendChild(b);
      qCuerpo.appendChild(fila);
    });
  } else {
    qCuerpo.appendChild(elem('p', 'q-msj', '¡No fallaste ninguna! Nada que repasar.'));
  }
  qCuerpo.scrollTop = 0;

  const rep = $('qPista');
  rep.hidden = false; rep.disabled = false; rep.textContent = 'Repetir';
  const sig = $('qSig');
  sig.hidden = false; sig.textContent = 'Listo ✓';
}

function volverInicioEval() {
  const c = evalEstado;
  if (!c) return;

  c.sel = -1;
  c.resuelta = true;

// ---------- Animación de la escena de evaluación ----------
function animarEval(ahora, dt) {
  const c = evalEstado;
  if (!c || !c.contenido) return;
  const s1 = 1 - Math.exp(-dt * 8);
  const enPanel = c.estado !== 'inicio';

  c.visBtn += ((enPanel ? 0 : 1) - c.visBtn) * s1;
  for (const b of c.animables) { b.userData.vis = c.visBtn; b.visible = c.visBtn > 0.01; }
  c.k += ((enPanel ? 1 : 0) - c.k) * s1;
  const e = c.k * c.k * (3 - 2 * c.k);
  const ct = c.contenido;

  // Posición y tamaño: en el centro de la pantalla de inicio, o junto al panel cuando hay preguntas
  slot.set(0, 0.2 + (1 - e) * 0.012 * Math.sin(ahora / 700), 0);
  let esc = EV_TAM_INICIO / ct.dim;
  if (enPanel || c.k > 0.002) {
    const foco = calcularFoco(c);
    slot.lerp(foco.pos, e);
    esc = THREE.MathUtils.lerp(esc, (ct.f * foco.tam) / (ct.dim * foco.mundoPorLocal), e);
  }
  c.anclaje.position.copy(slot);
  c.anclaje.scale.setScalar(esc);

  // Orientación de lo que se muestra
  const libre = ahora - c.tocado > 2500;
  if (ct.modo === 'medalla') {
    if (!enPanel || libre) {
      qa.setFromAxisAngle(EJE_Y, (enPanel ? 0.35 : 0.8) * Math.sin(ahora / 1300));
      qb.setFromAxisAngle(EJE_X, 0.06 * Math.sin(ahora / 1700));
      c.orient.quaternion.slerp(qa.multiply(qb), s1);
    }
  } else if (ct.modo === 'giro') {
    if (libre) { qa.setFromAxisAngle(EJE_Y, 0.5 * dt); c.orient.quaternion.premultiply(qa); }
  } else if (ct.modo === 'placa') {
    if (libre) {
      qb.setFromAxisAngle(EJE_X, Math.PI / 2 - 0.35);
      qa.setFromAxisAngle(EJE_Y, 0.22 * Math.sin(ahora / 1400));
      c.orient.quaternion.slerp(qa.multiply(qb), s1);
    }
    c.tickPlaca(ahora / 1000);
  }

  // Cronómetro del modo reto
  if (c.estado === 'pregunta' && c.modo === 'reto' && !c.resuelta) {
    const rest = c.limite - (ahora - c.tq) / 1000;
    const p = Math.max(rest / c.limite, 0);
    qBarra.style.width = (p * 100).toFixed(1) + '%';
    qBarra.style.background = p > 0.5 ? '#34c759' : p > 0.25 ? '#ffd60a' : '#ff453a';
    qSegTxt.textContent = Math.ceil(Math.max(rest, 0)) + ' s';
    if (rest <= 0) responder(-1);
  }
}

// =====================================================================
//  Botones 3D (toque sobre un botón del modelo)
// =====================================================================
const rayo = new THREE.Raycaster();
const punto = new THREE.Vector2();

function botonBajoElDedo(x, y) {
  const m = mundo[escenaActual];
  if (!m || !rig.visible) return null;
  punto.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  camera.updateMatrixWorld(true);
  rayo.setFromCamera(punto, camera);
  const golpes = rayo.intersectObjects(m.botones, true);
  if (!golpes.length) return null;
  let o = golpes[0].object;
  while (o && !o.userData.destino && !o.userData.alTocar) o = o.parent;
  return o || null;
}

function pulsar(boton) {
  // El panel del video no cambia de escena: reproduce / pausa (debe ocurrir justo al tocar para que el celular lo permita)
  if (boton.userData.alTocar) { boton.userData.alTocar(); return; }
  presion = { boton, t0: performance.now() };
  const destino = boton.userData.destino;
  setTimeout(() => cambiarEscena(destino), 170);
}

// Un toque corto: si cae sobre un botón 3D lo pulsa; si no, coloca la escena (como antes)
function tocar(x, y) {
  const boton = botonBajoElDedo(x, y);
  if (boton) pulsar(boton);
  else recolocar();
}

// =====================================================================
//  Giro y zoom con el dedo
// =====================================================================
const punteros = new Map();
let distPrevia = 0;
const eje = new THREE.Vector3();
const giro = new THREE.Quaternion();
const inversa = new THREE.Quaternion();

function distanciaDedos() {
  const [a, b] = [...punteros.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Ángulo de la línea que une los dos dedos (para detectar cuando los giras)
let angPrevio = 0;
function anguloDedos() {
  const [a, b] = [...punteros.values()];
  return Math.atan2(b.y - a.y, b.x - a.x);
}

// Giro con dos dedos: la escena (o la pieza que está en grande) gira sobre el eje de la pantalla, siguiendo tus dedos
const ejeZ = new THREE.Vector3(0, 0, 1);
function torcer(da) {
  const det = detalleActivo();
  let obj = pivot;
  if (det && det.sel >= 0) { det.tocado = performance.now(); obj = det.orient; }
  obj.parent.getWorldQuaternion(inversa).invert();
  eje.copy(ejeZ).applyQuaternion(camera.quaternion).applyQuaternion(inversa).normalize();
  giro.setFromAxisAngle(eje, -da);
  obj.quaternion.premultiply(giro);
}

function rotar(dx, dy) {
  // En "Contenido" el dedo gira el carrusel (o el componente que está en grande)
  rig.getWorldQuaternion(inversa).invert();
  const k = 0.008;

  eje.set(0, 1, 0).applyQuaternion(camera.quaternion).applyQuaternion(inversa).normalize();
  giro.setFromAxisAngle(eje, dx * k);
  pivot.quaternion.premultiply(giro);

  eje.set(1, 0, 0).applyQuaternion(camera.quaternion).applyQuaternion(inversa).normalize();
  giro.setFromAxisAngle(eje, dy * k);
  pivot.quaternion.premultiply(giro);
}

function acercar(razon) {
  const det = detalleActivo();
  if (det && det.sel >= 0) {
    det.zoom = THREE.MathUtils.clamp(det.zoom * razon, 0.5, 3);
    return;
  }
  if (escenaActual === 'contenido' && contenidoEstado && contenidoEstado.sel >= 0) {
    contenidoEstado.zoom = THREE.MathUtils.clamp(contenidoEstado.zoom * razon, 0.5, 3);
    return;
  }
  if (modo === 'visor') {
    zoomVisor = THREE.MathUtils.clamp(zoomVisor / razon, 0.35, 4);
  } else {
    arEscala = THREE.MathUtils.clamp(arEscala * razon, 0.25, 6);
    rig.scale.setScalar(tamanoAR());
  }
}

let toque = null;

gestos.addEventListener('pointerdown', (e) => {
  gestos.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (punteros.size === 1) {
    toque = { x: e.clientX, y: e.clientY, t: performance.now(), valido: true };
  } else if (toque) {
    toque.valido = false;
  }
  if (punteros.size === 2) { distPrevia = distanciaDedos(); angPrevio = anguloDedos(); }
});

gestos.addEventListener('pointermove', (e) => {
  const p = punteros.get(e.pointerId);
  if (!p) return;
  if (toque && toque.valido && Math.hypot(e.clientX - toque.x, e.clientY - toque.y) > 12) {
    toque.valido = false;
  }
  const dx = e.clientX - p.x;
  const dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;

  if (punteros.size === 1) {
    const det = detalleActivo();
    if (det && det.sel >= 0) {
      det.tocado = performance.now();
      rotarObjeto(det.orient, dx, dy);
    } else {
      rotar(dx, dy);
    }
  } else if (punteros.size === 2) {
    const nueva = distanciaDedos();
    if (distPrevia > 0) acercar(nueva / distPrevia);
    distPrevia = nueva;
    // Si además giras los dedos, la escena gira contigo
    const ang = anguloDedos();
    let da = ang - angPrevio;
    if (da > Math.PI) da -= 2 * Math.PI;
    else if (da < -Math.PI) da += 2 * Math.PI;
    angPrevio = ang;
    if (da !== 0 && nueva > 30) torcer(da);
  }
});

const soltar = (e) => {
  const eraUno = punteros.size === 1;
  punteros.delete(e.pointerId);
  if (punteros.size === 2) { distPrevia = distanciaDedos(); angPrevio = anguloDedos(); }
  if (e.type === 'pointerup' && eraUno && toque && toque.valido && performance.now() - toque.t < 400) {
    tocar(e.clientX, e.clientY);
  }
  if (punteros.size === 0) toque = null;
};
gestos.addEventListener('pointerup', soltar);
gestos.addEventListener('pointercancel', soltar);

gestos.addEventListener('wheel', (e) => {
  e.preventDefault();
  acercar(e.deltaY < 0 ? 1.08 : 0.92);
}, { passive: false });

ui.addEventListener('beforexrselect', (e) => e.preventDefault());

// =====================================================================
//  Poner la escena frente a la cámara  (igual que en la beta)
// =====================================================================
const ARRIBA = new THREE.Vector3(0, 1, 0);
const adelante = new THREE.Vector3();
const eulerFrente = new THREE.Euler(0, 0, 0, 'YXZ');

// Orientación para que la escena quede de frente a la cámara: sin ladearse, pero siguiendo
// también si miras hacia arriba o hacia abajo (así nunca se ve "desde arriba")
function mirarDeFrente(destino, dir) {
  if (Math.hypot(dir.x, dir.z) < 0.2) return false;
  const cabeceo = THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(dir.y, -1, 1)), -1.0, 1.0);
  eulerFrente.set(cabeceo, Math.atan2(-dir.x, -dir.z), 0, 'YXZ');
  destino.setFromEuler(eulerFrente);
  return true;
}

// Al avanzar o retroceder de pantalla, la escena se endereza al instante frente a ti
function enderezar() {
  if (modo === 'ar') {
    adelante.set(0, 0, -1).applyQuaternion(camera.quaternion);
  } else if (modo === 'xr') {
    camera.updateMatrixWorld(true);
    camera.matrixWorld.decompose(posTmp, quatTmp, escTmp);
    adelante.set(0, 0, -1).applyQuaternion(quatTmp);
  } else return;
  if (mirarDeFrente(qSeg, adelante)) rig.quaternion.copy(qSeg);
}

function colocarFrente(posCamara, quatCamara, reiniciarGiro = true) {
  adelante.set(0, 0, -1).applyQuaternion(quatCamara);
  rig.position.copy(adelante).multiplyScalar(AR_DISTANCIA).add(posCamara);
  // La escena queda SIEMPRE derecha: no copia la inclinación del celular, solo gira para mirar hacia ti.
  // (Antes copiaba todo el giro del celular, y por eso la portada salía chueca.)
  mirarDeFrente(rig.quaternion, adelante);
  rig.scale.setScalar(tamanoAR());
  if (reiniciarGiro || !colocado) pivot.quaternion.copy(vistaInicial());
  rig.visible = true;
  colocado = true;
  mostrarAviso('Listo. La escena te sigue donde mires.', false, 4000);
}

function recolocar() {
  if (modo === 'ar') {
    colocarFrente(new THREE.Vector3(0, 0, 0), camera.quaternion.clone(), false);
  } else if (modo === 'xr') {
    camera.updateMatrixWorld(true);
    camera.matrixWorld.decompose(posTmp, quatTmp, escTmp);
    colocarFrente(posTmp, quatTmp, false);
  }
}

// =====================================================================
//  AR con cámara + giroscopio  (sin cambios respecto a la beta)
// =====================================================================
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function anguloPantalla() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return window.orientation || 0;
}

function cuaternionDesdeGiroscopio(q, alfa, beta, gamma, orient) {
  euler.set(beta, alfa, -gamma, 'YXZ');
  q.setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -orient));
}

function alOrientar(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  clearTimeout(timerGiro);
  const rad = THREE.MathUtils.degToRad;
  cuaternionDesdeGiroscopio(objetivo, rad(e.alpha), rad(e.beta), rad(e.gamma), rad(anguloPantalla()));
  if (!colocado) {
    camera.quaternion.copy(objetivo);
    colocarFrente(new THREE.Vector3(0, 0, 0), objetivo);
  }
}

function textoError(err) {
  if (!navigator.mediaDevices) return 'Abre la página con https para poder usar la cámara.';
  const nombre = err && err.name ? ' (' + err.name + ')' : '';
  if (err && err.message === 'giro-denegado') return 'Necesito permiso de movimiento para seguir el celular.';
  if (err && (err.name === 'TimeoutError' || err.name === 'SinImagen')) return 'La cámara tardó demasiado en responder. Vuelve a tocar "AR con cámara" (si sigue igual, cierra otras apps que la usen).';
  if (err && err.name === 'NotAllowedError') return 'La cámara está bloqueada. Dale permiso en el candado de la barra de direcciones.';
  if (err && err.name === 'NotFoundError') return 'No se encontró ninguna cámara.';
  if (err && (err.name === 'NotReadableError' || err.name === 'AbortError')) {
    return 'La cámara está ocupada por otra app. Cierra las que la usen, recarga la página e intenta otra vez.' + nombre;
  }
  return 'No se pudo abrir la cámara. Recarga la página e intenta otra vez.' + nombre;
}

// Pide la cámara con tiempo límite. Si responde tarde, la apaga sola para no dejarla ocupada
function pedirCamara(pedido, ms) {
  return new Promise((resolver, rechazar) => {
    let terminado = false;
    const reloj = setTimeout(() => {
      terminado = true;
      rechazar(Object.assign(new Error('camara-lenta'), { name: 'TimeoutError' }));
    }, ms);
    navigator.mediaDevices.getUserMedia(pedido).then((stream) => {
      clearTimeout(reloj);
      if (terminado) { stream.getTracks().forEach((t) => t.stop()); return; }
      terminado = true;
      resolver(stream);
    }, (err) => {
      clearTimeout(reloj);
      if (terminado) return;
      terminado = true;
      rechazar(err);
    });
  });
}

async function abrirCamara() {
  // Primero una resolución moderada (abre más rápido y se ve fluido); si falla, pedidos más simples
  const intentos = [
    [{ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }, 9000],
    [{ video: { facingMode: { ideal: 'environment' } }, audio: false }, 7000],
    [{ video: true, audio: false }, 7000]
  ];
  let ultimo;
  for (const [pedido, ms] of intentos) {
    try {
      return await pedirCamara(pedido, ms);
    } catch (err) {
      ultimo = err;
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) break;
      await new Promise((r) => setTimeout(r, 300));
    }
  }
  throw ultimo;
}

function detenerCamara() {
  if (flujo) {
    flujo.getTracks().forEach((t) => { t.onended = null; t.stop(); });
    flujo = null;
  }
  video.pause();
  video.srcObject = null;
  video.style.display = '';
}

// Espera hasta que el video de la cámara de verdad tenga imagen (no solo que "haya abierto")
function esperarImagen(ms) {
  return new Promise((resolver, rechazar) => {
    const listo = () => video.readyState >= 2 && video.videoWidth > 0;
    if (listo()) { resolver(); return; }
    const t0 = performance.now();
    const reloj = setInterval(() => {
      if (video.paused) video.play().catch(() => {});
      if (listo()) { clearInterval(reloj); resolver(); }
      else if (performance.now() - t0 > ms) {
        clearInterval(reloj);
        rechazar(Object.assign(new Error('camara-sin-imagen'), { name: 'SinImagen' }));
      }
    }, 120);
  });
}

function alPerderCamara() {
  if (modo !== 'ar') return;
  volverAlVisor();
  mostrarAviso('Se perdió la cámara. Vuelve a tocar el botón de AR.', true, 5000);
}

// Si la app pasa a segundo plano y vuelve, el video se reanuda solo
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && modo === 'ar' && video.srcObject) video.play().catch(() => {});
});

async function iniciarAR() {
  if (modo !== 'visor' || iniciandoAR) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrarAviso(textoError(null), true);
    return;
  }
  iniciandoAR = true;
  const miIntento = ++fichaAR;
  btnAR.disabled = true;
  inicioBtn.disabled = true;
  mostrarAviso('Abriendo la cámara…');
  clearTimeout(timerAvisoCam);
  timerAvisoCam = setTimeout(() => {
    if (iniciandoAR) mostrarAviso('Sigue abriendo la cámara… un momento, ya casi.');
  }, 4000);

  try {
    // El permiso de movimiento (iPhone) debe pedirse justo dentro del toque
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('giro-denegado');
    }
    flujo = await abrirCamara();
    if (miIntento !== fichaAR) { detenerCamara(); return; }
    flujo.getVideoTracks().forEach((t) => { t.onended = alPerderCamara; });

    video.muted = true;
    video.playsInline = true;
    video.style.display = 'block';          // visible desde ya: algunos celulares no pintan un video oculto
    video.srcObject = flujo;
    video.play().catch(() => {});
    try {
      await esperarImagen(5000);
    } catch (e) {
      // Segundo intento: reconectar la cámara al video
      video.srcObject = null;
      video.srcObject = flujo;
      video.play().catch(() => {});
      await esperarImagen(5000);
    }
  } catch (err) {
    detenerCamara();
    mostrarAviso(textoError(err), true);
    return;
  } finally {
    clearTimeout(timerAvisoCam);
    iniciandoAR = false;
    btnAR.disabled = false;
    inicioBtn.disabled = false;
  }

  modo = 'ar';
  document.body.dataset.modo = 'ar';
  inicioEl.hidden = true;
  colocado = false;
  arEscala = 1;
  camera.fov = AR_FOV;
  camera.position.set(0, 0, 0);
  camera.quaternion.identity();
  camera.updateProjectionMatrix();
  rig.visible = false;
  mostrarAviso('Apunta hacia donde quieres la escena…');

  window.addEventListener('deviceorientation', alOrientar);
  timerGiro = setTimeout(() => {
    if (!colocado) {
      camera.quaternion.identity();
      objetivo.identity();
      colocarFrente(new THREE.Vector3(0, 0, 0), objetivo);
      mostrarAviso('Este equipo no entrega datos de giroscopio: la escena queda fija en pantalla, pero puedes girarla con el dedo.', true, 6000);
    }
  }, 2500);
}

// =====================================================================
//  AR con seguimiento (WebXR), opcional: solo con ?xr en la dirección
// =====================================================================
async function iniciarXR() {
  if (modo !== 'visor') return;
  try {
    const sesion = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: ui }
    });
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(sesion);
    sesion.addEventListener('end', volverAlVisor);

    modo = 'xr';
    document.body.dataset.modo = 'xr';
    colocado = false;
    framesXR = 0;
    arEscala = 1;
    rig.visible = false;
    ocultarAviso();
  } catch (err) {
    renderer.xr.enabled = false;
    mostrarAviso('No se pudo iniciar este modo. Prueba con "AR con cámara".', true, 5000);
  }
}

const permitirXR = new URLSearchParams(window.location.search).has('xr');
if (permitirXR && navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-ar')
    .then((ok) => { if (ok) btnXR.hidden = false; })
    .catch(() => {});
}

// =====================================================================
//  Volver al visor 3D
// =====================================================================
function volverAlVisor() {
  clearTimeout(timerGiro);
  window.removeEventListener('deviceorientation', alOrientar);
  detenerCamara();
  renderer.xr.enabled = false;

  modo = 'visor';
  document.body.dataset.modo = 'visor';
  colocado = false;
  zoomVisor = 1;

  camera.fov = VISOR_FOV;
  camera.quaternion.identity();
  camera.position.set(0, 0, 0);
  rig.position.set(0, 0, 0);
  rig.quaternion.identity();
  rig.scale.setScalar(1);
  rig.visible = true;
  pivot.quaternion.copy(vistaInicial());

  redimensionar();
  ocultarAviso();
  if (soloAR) {                  // con el QR no se queda en 3D: vuelve a la pantalla del botón de AR
    inicioMsg.textContent = '';
    inicioEl.hidden = false;
  }
}

function salir() {
  const sesion = renderer.xr.getSession && renderer.xr.getSession();
  if (modo === 'xr' && sesion) {
    sesion.end();
  } else {
    volverAlVisor();
  }
}

function restablecer() {
  if (escenaActual === 'contenido' || escenaActual === 'protoboard' || escenaActual === 'arduino' || escenaActual === 'fundamentacion' || esCir()) cerrarFicha();
  pivot.quaternion.copy(vistaInicial());
  zoomVisor = 1;
}

btnAR.addEventListener('click', iniciarAR);
inicioBtn.addEventListener('click', iniciarAR);
inicio3D.addEventListener('click', () => { inicioEl.hidden = true; });

// =====================================================================
//  Abrir desde un QR: navegador interno, instalar como app y cache
// =====================================================================
const uaTexto = navigator.userAgent || '';
const esAndroid = /Android/i.test(uaTexto);
const esIOS = /iPhone|iPad|iPod/i.test(uaTexto);
// Dentro de WhatsApp, Instagram, Facebook, TikTok... la cámara suele fallar: se detecta para avisar
const navegadorInterno = /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|TikTok|musical_ly|MicroMessenger|Messenger|Twitter|LinkedInApp|; wv\)/i.test(uaTexto)
  || (esIOS && !/Safari\//.test(uaTexto));

if (navegadorInterno) {
  navAviso.hidden = false;
  if (esAndroid) {
    navTexto.textContent = 'Estás dentro de otra app y ahí la cámara puede fallar. Ábrelo en Chrome:';
    navBtn.textContent = 'Abrir en Chrome';
    navBtn.addEventListener('click', () => {
      const sinEsquema = window.location.host + window.location.pathname + window.location.search;
      window.location.href = 'intent://' + sinEsquema + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='
        + encodeURIComponent(window.location.href) + ';end';
    });
  } else {
    navTexto.textContent = 'Estás dentro de otra app y ahí la cámara puede fallar. Toca el menú (···) o el ícono de compartir y elige "Abrir en Safari", o copia el enlace.';
    navBtn.textContent = 'Copiar enlace';
    navBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        navBtn.textContent = '¡Enlace copiado!';
      } catch (e) {
        navBtn.textContent = 'Copia el enlace de la barra';
      }
    });
  }
}

// Botón "Instalar como app" (Android/Chrome): después se abre desde el ícono, sin barra de direcciones
let eventoInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  eventoInstalar = e;
  instalarBtn.hidden = false;
});
instalarBtn.addEventListener('click', async () => {
  if (!eventoInstalar) return;
  eventoInstalar.prompt();
  try { await eventoInstalar.userChoice; } catch (e) { /* cerrado */ }
  eventoInstalar = null;
  instalarBtn.hidden = true;
});
window.addEventListener('appinstalled', () => { instalarBtn.hidden = true; });

// Guarda los modelos en el celular: desde la segunda vez abre mucho más rápido (necesita sw.js junto al index.html)
if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* sin sw.js todo funciona igual */ });
}

btnXR.addEventListener('click', iniciarXR);
$('salir').addEventListener('click', salir);
$('restablecer').addEventListener('click', restablecer);

// =====================================================================
//  Bucle de dibujo
// =====================================================================
const posTmp = new THREE.Vector3();
const quatTmp = new THREE.Quaternion();
const escTmp = new THREE.Vector3();
const facil = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);   // rebote suave
let tAnterior = performance.now();
const objPos = new THREE.Vector3();
const qSeg = new THREE.Quaternion();
const CERO = new THREE.Vector3();

// La escena (portada, menú, contenidos...) acompaña siempre a la cámara, suavemente
function seguirCamara(dt, posCam, quatCam) {
  adelante.set(0, 0, -1).applyQuaternion(quatCam);
  objPos.copy(adelante).multiplyScalar(AR_DISTANCIA).add(posCam);
  const k = 1 - Math.exp(-dt * SEGUIR_ESCENA);
  rig.position.lerp(objPos, k);
  if (mirarDeFrente(qSeg, adelante)) rig.quaternion.slerp(qSeg, k);
}

function animarEscena(ahora, dt) {
  const m = mundo[escenaActual];
  if (!m) return;

  if (escenaActual === 'contenido') animarContenido(ahora, dt);
  if (escenaActual === 'protoboard') animarProto(ahora, dt);
  if (escenaActual === 'arduino') animarArd(ahora, dt);
  if (esCir()) animarCir(ahora, dt);
  if (escenaActual === 'evaluacion') animarEval(ahora, dt);
  if (escenaActual === 'fundamentacion') animarFund(ahora, dt);

  // Aparición al cambiar de escena
  const t = Math.min((ahora - tAparicion) / 450, 1);
  m.soporte.scale.setScalar(m.soporte.userData.escala * Math.max(facil(t), 0.001));

  // Piezas flotantes de la portada
  for (const p of m.flotantes) {
    const f = p.userData.flota;
    p.position.y = f.y + Math.sin(ahora / 1000 * f.vel + f.fase) * f.amp;
    p.rotation.y += f.giro * dt;
  }

  // Botones 3D: latido suave (invita a tocar) + hundimiento al pulsarlos
  if (m.soporte === (mundo.video && mundo.video.soporte) && panelVideo) panelVideo.icono.visible = videoEl.paused;

  for (const b of (m.animables || m.botones)) {
    if (b.userData.tick) b.userData.tick(ahora);
    if (b.userData.sinLatido) continue;
    let k = b.userData.sinPulso ? 1 : 1 + 0.025 * Math.sin(ahora / 1000 * 2.4 + (b.position.x + b.position.y) * 10);
    if (presion && presion.boton === b) {
      const p = (ahora - presion.t0) / 260;
      if (p >= 1) presion = null;
      else k *= 1 - 0.2 * Math.sin(Math.PI * p);
    }
    b.scale.setScalar(b.userData.escalaBase * k * (b.userData.vis ?? 1));
  }
}

renderer.setAnimationLoop(() => {
  const ahora = performance.now();
  const dt = Math.min((ahora - tAnterior) / 1000, 0.1);
  tAnterior = ahora;

  if (modo === 'visor') {
    camera.position.set(0, 0, distVisor * zoomVisor);
  } else if (modo === 'ar') {
    if (colocado) { camera.quaternion.slerp(objetivo, 1 - Math.exp(-dt * SUAVIDAD_GIRO)); seguirCamara(dt, CERO, camera.quaternion); }
  } else if (modo === 'xr') {
    framesXR++;
    if (!colocado && framesXR >= 3) {
      camera.updateMatrixWorld(true);
      camera.matrixWorld.decompose(posTmp, quatTmp, escTmp);
      colocarFrente(posTmp, quatTmp);
    } else if (colocado) {
      camera.updateMatrixWorld(true);
      camera.matrixWorld.decompose(posTmp, quatTmp, escTmp);
      seguirCamara(dt, posTmp, quatTmp);
    }
  }
  animarEscena(ahora, dt);
  renderer.render(scene, camera);
});
</script>
